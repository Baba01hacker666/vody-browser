name: Release signed APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0). Leave empty to auto-bump the patch version from the latest v* tag.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_VERSION: "8.9"

permissions:
  contents: write

jobs:
  release:
    name: Sign, build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (compileSdk 35 + build-tools 35.0.0)
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set SDK dir
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Compute the release version: explicit input wins; otherwise bump the
      # patch segment of the latest v* tag (v1.1.0 -> 1.1.1). versionCode is the
      # workflow run number so it always increases.
      - name: Compute version
        id: ver
        run: |
          set -eu
          if [ -n "${{ inputs.version_name }}" ]; then
            NAME="${{ inputs.version_name }}"
          else
            LAST="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v1.1.0)"
            BASE="${LAST#v}"
            MAJMIN="${BASE%.*}"
            PATCH="${BASE##*.}"
            NAME="${MAJMIN}.$((PATCH + 1))"
          fi
          CODE="${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $NAME (code $CODE)"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/vody-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/vody-release.jks" >> "$GITHUB_ENV"

      - name: Download Gradle and regenerate wrapper
        run: |
          curl -sSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip
          ./gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version "${GRADLE_VERSION}"
          chmod +x gradlew
          rm -rf gradle-${GRADLE_VERSION} gradle.zip

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk "vody-browser-${VERSION_NAME}.apk"

      - name: Verify signature
        run: |
          APK=$(ls vody-browser-*.apk)
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          gh release create "$TAG" \
            --title "Vody Browser $VERSION_NAME" \
            --notes "Signed release build of Vody Browser.

          - GeckoView (Firefox engine), arm64-v8a
          - Install the APK directly; updates need the same signing key." \
            "vody-browser-${VERSION_NAME}.apk"
