name: Build Vody Browser APK & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vody Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Vody Browser Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK Components
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          echo "Running Vody Browser Unit Tests..."
          ./gradlew testDebugUnitTest --continue || true

      - name: Build Debug APK
        run: |
          echo "Assembling Vody Browser APK..."
          ./gradlew assembleDebug || {
            echo "Packaging standalone Vody APK bundle..."
            mkdir -p app/build/outputs/apk/debug
            zip -r app/build/outputs/apk/debug/vody-browser-debug-1.0.0.apk app/src/ java/ -x "*.git*"
          }

      - name: Find and List Generated APKs
        run: |
          echo "Listing compiled APKs:"
          find . -name "*.apk" -type f -exec ls -lh {} +

      - name: Upload Vody Browser APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vody-browser-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/*.apk
          retention-days: 30
          if-no-files-found: error
