name: Build Vody Browser (GeckoView)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vody Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (compileSdk 35 + build-tools 35.0.0)
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set SDK dir
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build arm64 debug APK (GeckoView engine)
        run: ./gradlew assembleDebug --no-daemon

      - name: List generated APK
        run: find . -name "*.apk" -type f -exec ls -lh {} +

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vody-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
