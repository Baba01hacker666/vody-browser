plugins {
    id 'com.android.application'
}

android {
    namespace 'org.chromium.chrome'
    compileSdk 35

    defaultConfig {
        applicationId 'org.vody.browser'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = [
                '../java/src',
                '../features/tab_ui/java/src',
                '../feed/core/java/src',
                '../webapk/shell_apk/src'
            ]
            res.srcDirs = [
                '../java/res',
                '../java/res_chromium_base',
                '../java/res_base',
                '../ui/android/java/res',
                '../components/browser_ui/styles/android/java/res',
                '../components/browser_ui/theme/android/java/res',
                '../components/browser_ui/widget/android/java/res',
                '../components/browser_ui/settings/android/java/res',
                '../components/browser_ui/bottomsheet/android/java/res',
                '../components/browser_ui/modaldialog/android/java/res',
                '../components/browser_ui/site_settings/android/java/res',
                '../components/browser_ui/share/android/java/res',
                '../features/tab_ui/java/res',
                '../feed/core/java/res'
            ]
        }
        test {
            java.srcDirs = ['../junit/src']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "vody-browser-${variant.name}-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'org.json:json:20240303'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
