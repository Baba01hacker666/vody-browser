plugins {
    id 'com.android.application'
}

// CI (release workflow) injects the signing key material and version via env vars;
// locally you can override versions with -PversionName=1.2.3 -PversionCode=42.
def envVersionName = System.getenv("VERSION_NAME") ?: project.findProperty("versionName")
def envVersionCode = System.getenv("VERSION_CODE") ?: project.findProperty("versionCode")
def hasReleaseSigning = System.getenv("KEYSTORE_FILE") != null

android {
    namespace 'org.vody.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'org.vody.browser'
        minSdk 26
        targetSdk 36
        versionCode envVersionCode ? envVersionCode.toInteger() : 2
        versionName envVersionName ?: "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Only ship phone ABIs. The full-fat APK was ~643 MB because GeckoView's native
        // engine was bundled for arm32/arm64/x86/x86_64. Restricting to arm64-v8a (add
        // 'armeabi-v7a' for older phones) cuts that dramatically.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // Populated by the CI release workflow from GitHub secrets
            // (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD).
            if (hasReleaseSigning) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the release key when CI secrets are present;
            // falls back to debug signing for local test builds.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            // Shrink the debug build too so we can measure a realistic size.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
        test {
            java.srcDirs = ['src/test/java']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "vody-browser-${variant.name}-${variant.versionName}.apk"
        }
    }

    // Compress the bundled native (.so) libraries instead of storing them uncompressed.
    // GeckoView's engine is ~500 MB of .so; compressing it trims a big chunk off the APK.
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'org.json:json:20240303'

    // Mozilla GeckoView — real Firefox engine (rendering + WebExtensions + DevTools).
    // Pinned to 134 (minCompileSdk=1) so it builds with AGP 8.7 / compileSdk 35.
    implementation 'org.mozilla.geckoview:geckoview:134.0.20250113121357'

    testImplementation 'junit:junit:4.13.2'
}
